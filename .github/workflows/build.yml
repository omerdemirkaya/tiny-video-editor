name: Build Tiny Video Editor

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: TinyVideoEditor-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Put the files in a private draft release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete store-upload --yes --cleanup-tag 2>/dev/null || true
          gh release create store-upload dist/release/* --draft --title "Store upload (draft, not public)" \
            --notes "Built from ${{ github.sha }}. Draft release: only visible to the repository owner." \
            --target ${{ github.sha }}

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/release/*
